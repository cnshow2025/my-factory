<meta charset="utf-8">
<style>
 body{margin:0;background:#fff;font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}
 .c{background:#fff;padding:14px 16px 10px;box-sizing:border-box}
 .ct{font-size:15px;font-weight:700;color:#1E2761;margin:0 0 10px}
 .lg{display:flex;gap:16px;font-size:12px;color:#16213E;margin:8px 0 0 4px}
 .lg span{display:flex;align-items:center;gap:6px}
 .lg i{width:16px;height:3px;border-radius:2px}
 text{font-family:inherit}
</style>
<script>
const TEAL="#1C7293", NAVY="#1E2761", GOOD="#0F7B6C", WARN="#C2410C", BAD="#9B1C1C",
      AMBER="#E0A458", INK="#16213E", MUTED="#5A6785", GRID="#E3E8F0";
const fmt = (v,d) => (d!=null? v.toFixed(d) : (Math.abs(v)>=1000? v.toLocaleString() : (Math.round(v*10)/10).toString()));

function hbar(el,{title,labels,values,color=TEAL,unit="",max=null,pl=210,dec=null,colors=null,ref=null,refLabel=""}){
  const PL=pl;
  const W=el.dataset.w*1, H=el.dataset.h*1, PR=78, PT=8, PB=22;
  const m = max ?? Math.max(...values)*1.12, mn = Math.min(0,...values)*1.1;
  const bw=(H-PT-PB)/labels.length, x=v=>PL+(v-mn)/(m-mn)*(W-PL-PR);
  let s=`<svg width="${W}" height="${H}">`;
  const zero=x(0);
  for(let i=0;i<labels.length;i++){
    const y=PT+i*bw, v=values[i], x0=Math.min(zero,x(v)), w=Math.abs(x(v)-zero);
    s+=`<rect x="${x0}" y="${y+bw*0.16}" width="${w}" height="${bw*0.68}" rx="3" fill="${v<0?WARN:(colors&&colors[i])||color}"/>`;
    s+=`<text x="${PL-12}" y="${y+bw/2+5}" text-anchor="end" font-size="13" fill="${INK}">${labels[i]}</text>`;
    s+=`<text x="${(v<0?zero+10:x0+w+8)}" y="${y+bw/2+5}" text-anchor="start" font-size="13" font-weight="700" fill="${v<0?WARN:INK}">${fmt(v,dec)}${unit}</text>`;
  }
  s+=`<line x1="${zero}" y1="${PT}" x2="${zero}" y2="${H-PB}" stroke="${GRID}" stroke-width="1.5"/>`;
  if(ref!=null){
    const rx=x(ref);
    s+=`<line x1="${rx}" y1="${PT-2}" x2="${rx}" y2="${H-PB}" stroke="${INK}" stroke-width="2" stroke-dasharray="7 5"/>`
      +`<text x="${rx+8}" y="${PT+12}" font-size="13" font-weight="700" fill="${INK}">${refLabel}</text>`;
  }
  s+=`</svg>`;
  el.innerHTML=(title?`<div class="ct">${title}</div>`:"")+s;
}
function vbar(el,{title,labels,values,color=TEAL,unit="",series2=null,names=null,min=0,max=null,dec=null,color2=AMBER}){
  const W=el.dataset.w*1, H=el.dataset.h*1, PL=64, PR=14, PT=22, PB=(series2?58:44);
  const all=series2?[...values,...series2]:values;
  const m=max ?? Math.max(...all)*1.18;
  const gw=(W-PL-PR)/labels.length, n=series2?2:1;
  const y=v=>H-PB-(v-min)/(m-min)*(H-PT-PB);
  let s=`<svg width="${W}" height="${H}">`;
  for(let t=0;t<=4;t++){const v=min+(m-min)*t/4;
    s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="${GRID}"/>`
      +`<text x="${PL-10}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${MUTED}">${fmt(v)}</text>`;}
  labels.forEach((lb,i)=>{
    const bx=PL+i*gw, bw=gw*0.62/n, off=(gw-bw*n)/2;
    [values, series2].filter(Boolean).forEach((arr,k)=>{
      const v=arr[i], X=bx+off+k*bw;
      s+=`<rect x="${X}" y="${y(v)}" width="${bw}" height="${H-PB-y(v)}" rx="3" fill="${k?color2:color}"/>`
        +`<text x="${X+bw/2}" y="${y(v)-7}" text-anchor="middle" font-size="12" font-weight="700" fill="${INK}">${fmt(v,dec)}</text>`;
    });
    lb.split("\n").forEach((t,j)=>{ s+=`<text x="${bx+gw/2}" y="${H-PB+17+j*14}" text-anchor="middle" font-size="12" fill="${INK}">${t}</text>`; });
  });
  s+=`</svg>`;
  let lg="";
  if(series2&&names) lg=`<div class="lg"><span><i style="background:${color}"></i>${names[0]}</span><span><i style="background:${color2}"></i>${names[1]}</span></div>`;
  el.innerHTML=(title?`<div class="ct">${title}</div>`:"")+s+lg;
}
function line(el,{title,labels,series,unit="",min=null,max=null,colors=[TEAL,NAVY,AMBER],pr=22,dec=null}){
  const W=el.dataset.w*1, H=el.dataset.h*1, PL=62, PR=pr, PT=24, PB=(series.length>1?56:42);
  const all=series.flatMap(s=>s.values);
  const m=max ?? Math.max(...all)*1.10, mn=min ?? Math.min(...all)*0.88;
  const x=i=>PL+i*(W-PL-PR)/(labels.length-1), y=v=>H-PB-(v-mn)/(m-mn)*(H-PT-PB);
  let s=`<svg width="${W}" height="${H}">`;
  for(let t=0;t<=4;t++){const v=mn+(m-mn)*t/4;
    s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="${GRID}"/>`
      +`<text x="${PL-10}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${MUTED}">${fmt(v)}</text>`;}
  labels.forEach((lb,i)=>{ s+=`<text x="${x(i)}" y="${H-PB+18}" text-anchor="middle" font-size="12" fill="${INK}">${lb}</text>`; });
  series.forEach((se,k)=>{
    const c=colors[k%colors.length];
    s+=`<polyline points="${se.values.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.values.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="5.5" fill="${c}" stroke="#fff" stroke-width="2"/>`;
      if(series.length===1) s+=`<text x="${x(i)}" y="${y(v)-13}" text-anchor="middle" font-size="12" font-weight="700" fill="${INK}">${fmt(v,dec)}${unit}</text>`; });
  });
  s+=`</svg>`;
  let lg="";
  if(series.length>1) lg=`<div class="lg">${series.map((se,k)=>`<span><i style="background:${colors[k%colors.length]}"></i>${se.name}</span>`).join("")}</div>`;
  el.innerHTML=(title?`<div class="ct">${title}</div>`:"")+s+lg;
}
function donut(el,{title,labels,values,colors}){
  const W=el.dataset.w*1, H=el.dataset.h*1, R=Math.min(W*0.52,H-70)/2, CX=R+24, CY=(H-40)/2+18, IR=R*0.56;
  const tot=values.reduce((a,b)=>a+b,0); let a0=-Math.PI/2;
  let s=`<svg width="${W}" height="${H}">`;
  values.forEach((v,i)=>{
    const a1=a0+v/tot*Math.PI*2, big=(a1-a0)>Math.PI?1:0;
    const p=(r,a)=>[CX+r*Math.cos(a),CY+r*Math.sin(a)];
    const [x1,y1]=p(R,a0),[x2,y2]=p(R,a1),[x3,y3]=p(IR,a1),[x4,y4]=p(IR,a0);
    s+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${IR} ${IR} 0 ${big} 0 ${x4} ${y4}Z" fill="${colors[i]}" stroke="#fff" stroke-width="2"/>`;
    const [lx,ly]=p((R+IR)/2,(a0+a1)/2);
    if(v/tot>0.05) s+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${v}%</text>`;
    a0=a1;
  });
  labels.forEach((lb,i)=>{
    const ly=CY-R+i*26+6;
    s+=`<rect x="${CX+R+26}" y="${ly-11}" width="14" height="14" rx="3" fill="${colors[i]}"/>`
      +`<text x="${CX+R+48}" y="${ly}" font-size="13" fill="${INK}">${lb} ${values[i]}%</text>`;
  });
  s+=`</svg>`;
  el.innerHTML=(title?`<div class="ct">${title}</div>`:"")+s;
}
</script>
